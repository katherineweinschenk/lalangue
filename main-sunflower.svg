    <path d="M134 96
      C137 115 146 126 151 143
      C157 162 153 182 159 199
      C166 217 177 231 177 252
      C177 278 166 303 168 327
      C170 355 184 382 180 414
      C177 442 165 468 162 508"
      fill="none" stroke-width="3" opacity=".7"/>

    <!-- upper right seed bract -->
    <path d="M142 125 C154 132 164 145 164 157 C157 151 151 148 146 145
      C150 157 150 171 146 181 C140 165 137 145 142 125 Z"/>

    <!-- long left leaf -->
    <path d="M149 180
      C135 191 124 211 122 234
      C120 252 124 268 132 282
      C135 257 142 238 154 219
      C160 208 160 193 149 180 Z"/>
    <path d="M150 190 C143 216 136 244 132 272" fill="none" stroke="#f7f4ef" stroke-width="1.5" opacity=".35"/>

    <!-- right leaf -->
    <path d="M166 236
      C183 241 197 257 201 277
      C187 271 177 267 167 256
      C164 250 163 243 166 236 Z"/>

    <!-- lower torn leaves -->
    <path d="M161 291
      C143 305 132 326 132 348
      L143 340 139 363 150 352 151 380 159 361
      C165 341 168 315 161 291 Z"/>
    <path d="M169 330
      C186 341 195 359 194 381
      L185 370 184 394 177 382 173 408 168 385
      C164 368 163 347 169 330 Z"/>
    <path d="M164 397
      C148 415 140 439 143 467
      L151 452 151 484 158 466 161 497 168 469
      C172 446 171 419 164 397 Z"/>

    <!-- dry scars and fibers in the stalk -->
    <g fill="none" stroke="#f7f4ef" stroke-width="1.6" opacity=".45">
      <path d="M151 153 C149 172 155 184 153 205"/>
      <path d="M160 217 C165 236 163 255 159 274"/>
      <path d="M164 285 C158 310 164 331 162 351"/>
      <path d="M171 371 C174 393 165 419 163 437"/>
      <path d="M158 450 C160 469 155 488 154 503"/>
    </g>

    <!-- a few loose ink flecks from the original edge -->
    <g stroke="none">
      <circle cx="181" cy="99" r="3"/><circle cx="187" cy="107" r="1.8"/>
      <circle cx="49" cy="91" r="2"/><circle cx="55" cy="99" r="1.2"/>
      <circle cx="124" cy="14" r="1.5"/>
    </g>
  </g>
</svg>
