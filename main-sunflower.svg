<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 520" role="img" aria-labelledby="title desc">
  <title id="title">Main sunflower isolated from the painting</title>
  <desc id="desc">A hand-traced, rough black silhouette of the tall central sunflower, with transparent background.</desc>
  <g fill="#211f1e" stroke="#211f1e" stroke-linecap="round" stroke-linejoin="round">
    <!-- irregular flower head and pointed petals -->
    <path d="M106 21
      L111 2 116 19 124 7 125 23 136 4 135 25 151 13 145 29
      164 19 153 34 176 30 159 43 183 44 161 51 184 59 162 62
      181 75 158 72 175 89 153 81 163 101 145 88 149 109 133 93
      132 116 121 96 114 119 106 97 95 117 95 94 80 111 84 89
      65 101 73 81 50 88 65 72 42 73 63 62 38 57 61 53
      40 42 65 46 48 31 70 38 59 19 78 31 74 10 89 27 94 4 100 24 Z"/>
    <path d="M76 33 C87 22 110 18 129 26 C148 34 159 50 157 67
      C155 86 137 99 112 98 C88 98 67 84 63 65 C60 53 65 41 76 33 Z"/>

    <!-- chipped highlights retained as transparent cuts -->
    <g fill="#fff" stroke="none" opacity=".25">
      <path d="M84 36 l9 -4 3 3 -10 5 Z"/>
      <path d="M139 51 l7 -2 -1 5 -7 2 Z"/>
      <path d="M101 83 l5 -3 3 4 -7 2 Z"/>
    </g>

    <!-- crooked primary stalk -->
    <path d="M126 94
      C129 112 138 125 143 142
      C149 161 145 179 151 197
      C157 216 168 229 169 249
      C170 278 158 299 160 326
      C162 356 177 381 172 411
      C168 436 156 461 153 506"
